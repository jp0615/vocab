<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>單字小達人</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#fff4d6,#ffe0ec 55%,#dff3ff);color:#3a2e5a}
#app{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);min-height:100%}
h1{font-size:40px;margin:6px 0;text-align:center}
h2{font-size:28px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.stars{background:#fff;border-radius:30px;padding:8px 20px;font-size:28px;font-weight:800;box-shadow:0 4px 0 #f3c94b;color:#e08a00}
.btn{display:block;border:0;border-radius:24px;padding:18px 22px;font-size:26px;font-weight:800;color:#fff;background:#ff7a59;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer;font-family:inherit;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.blue{background:#3b9cff}.btn.green{background:#38c172}.btn.purple{background:#9b6bff}.btn.yellow{background:#ffb800;color:#5a3d00}.btn.gray{background:#8e8aa5}.btn.red{background:#ef5b73}
.btn.small{font-size:18px;padding:10px 14px;border-radius:16px;display:inline-block}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}
.card{background:#fff;border-radius:26px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.08);margin:12px 0}
.hero{text-align:center;font-size:90px;margin:6px 0}
.big{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
.mid{text-align:center;font-size:24px;color:#6a5d94}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.opt{font-size:34px;padding:26px 10px;background:#fff;color:#3a2e5a;border:4px solid #d9ceff;border-radius:26px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 0 #d9ceff}
.opt.ok{background:#b8f2cf;border-color:#38c172;box-shadow:0 6px 0 #38c172}
.opt.no{background:#ffd0d6;border-color:#ef5b73;animation:shake .4s}
.spk{font-size:50px;background:#3b9cff;border:0;border-radius:50%;width:96px;height:96px;margin:10px auto;display:block;color:#fff;box-shadow:0 6px 0 #1d6fc4;cursor:pointer}
.spk.sm{width:48px;height:48px;font-size:24px;margin:0;display:inline-block;box-shadow:0 3px 0 #1d6fc4;vertical-align:middle}
.spk:active{transform:translateY(3px)}
.bar{height:18px;background:#fff;border-radius:10px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#38c172,#ffb800);transition:width .3s}
.slots,.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:64px;height:76px;border-bottom:6px solid #9b6bff;background:#fff;border-radius:14px 14px 0 0;font-size:44px;font-weight:800;text-align:center;line-height:76px;text-transform:none}
.tile{width:74px;height:74px;font-size:40px;font-weight:800;border:0;border-radius:18px;background:#ffb800;color:#5a3d00;box-shadow:0 6px 0 #c98a00;font-family:inherit;cursor:pointer}
.tile.used{opacity:.2;pointer-events:none}.tile.bad{animation:shake .4s;background:#ef5b73;color:#fff}
.mcard{height:110px;border-radius:20px;border:0;font-size:28px;font-weight:800;font-family:inherit;background:#9b6bff;color:#fff;box-shadow:0 5px 0 #6d3fd1;cursor:pointer;padding:4px}
.mcard.up{background:#fff;color:#3a2e5a;box-shadow:0 5px 0 #d9ceff;border:3px solid #d9ceff}
.mcard.done{background:#b8f2cf;color:#1d6b3e;box-shadow:none;pointer-events:none}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.msg{text-align:center;font-size:32px;font-weight:800;min-height:48px;color:#e0527a;margin:6px 0}
input[type=text],textarea,select{width:100%;font-size:22px;padding:12px;border:3px solid #d9ceff;border-radius:16px;font-family:inherit;background:#fff;color:#3a2e5a}
textarea{min-height:130px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.w{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e4dcff;font-size:22px}
.w .e{font-size:34px;width:46px;text-align:center}.w .t{flex:1}.w small{color:#8e8aa5;font-size:16px;display:block}
.pill{display:inline-block;padding:4px 12px;border-radius:14px;font-size:16px;font-weight:700;color:#fff}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.sp-ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(30,20,60,.72);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.sp-card{background:linear-gradient(160deg,#fff7e0,#ffe0b8);border:6px solid #ff8a1f;border-radius:32px;max-width:600px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:spPop .5s .9s both}
.qv-q{font-size:32px;line-height:1.5;font-weight:800;color:#3a2e5a;margin:6px 0 4px}
.qv-w{font-size:24px;color:#8a5a00;margin-bottom:14px}
.qv-m{font-size:28px;line-height:1.5;color:#1f7a45;font-weight:700;background:#fff;border-radius:20px;padding:14px 16px;margin:10px 0 18px}
.sp-ball{font-size:120px;line-height:1;display:inline-block;animation:spFly 1.1s cubic-bezier(.2,.8,.3,1.15) both}
.sp-t{font-size:40px;font-weight:900;color:#e0561f;margin:8px 0}
.sp-m{font-size:30px;line-height:1.5;color:#3a2e5a;font-weight:700;margin:10px 0}
.sp-s{font-size:26px;color:#7a4b00;margin:6px 0 18px}
@keyframes spFly{0%{transform:translate(-70vw,-50vh) rotate(-900deg) scale(.3);opacity:0}60%{opacity:1}80%{transform:translate(0,20px) rotate(10deg) scale(1.15)}100%{transform:none}}
@keyframes spPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#3a2e5a;color:#fff;padding:14px 26px;border-radius:24px;font-size:22px;z-index:60;display:none}
#fx{pointer-events:none}
.hwtop{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0}.hwemo{font-size:60px}.hwzh{font-size:38px;font-weight:800}
.hwwrap{background:#fff;border:4px solid #d9ceff;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 #d9ceff}
#hwc{display:block;touch-action:none;-webkit-touch-callout:none;cursor:crosshair}
.hwtools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}.hwtools .btn{flex:1;min-width:130px;font-size:22px;padding:14px 10px}
.hwst{font-size:16px;color:#8e8aa5;text-align:center;margin-top:8px;min-height:20px}.hwpen{display:block;margin-top:10px;font-size:18px;color:#6a5d94;text-align:center}.hwpen input{width:22px;height:22px;vertical-align:middle}
.hwcmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hwimg{width:100%;border-radius:12px;border:2px solid #e4dcff;display:block}
.exs{font-size:22px;color:#3a2e5a;margin-top:6px}.exs small{display:block;color:#8e8aa5;font-size:17px}
.lcard{background:#fff;border-radius:26px;padding:16px;box-shadow:0 6px 0 #d9ceff;border:4px solid #d9ceff;text-align:center}
.lcard .en{font-size:38px;font-weight:800}.lcard .ex{font-size:24px;margin-top:8px;color:#3a2e5a}.lcard .exzh{font-size:19px;color:#8e8aa5}
.lbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.sent{font-size:36px;font-weight:800;text-align:center;line-height:1.5;margin:10px 0;background:#fff;border-radius:22px;padding:14px}
.sent .gap{display:inline-block;min-width:110px;border-bottom:5px solid #9b6bff;color:#38c172}
.sentzh{text-align:center;font-size:24px;color:#6a5d94}
.otiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:84px}
.otile{min-width:84px;height:76px;padding:0 18px;font-size:32px;font-weight:800;border:0;border-radius:18px;background:#ffb800;color:#5a3d00;box-shadow:0 6px 0 #c98a00;font-family:inherit;cursor:pointer}
.otile.put{background:#9b6bff;color:#fff;box-shadow:0 6px 0 #6d3fd1}.otile.bad{background:#ef5b73;color:#fff;animation:shake .4s}
.oans{background:#fff;border-radius:22px;border:4px dashed #d9ceff;padding:8px;align-items:center}
.oend{font-size:40px;font-weight:800;align-self:flex-end}
@media (max-width:600px){.opt{font-size:26px}.tile{width:56px;height:56px;font-size:30px}.slot{width:48px;height:60px;line-height:60px;font-size:34px}.mgrid{grid-template-columns:repeat(3,1fr)}}
</style>

<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<script src="dict.js"></script>
<script src="sentences.js"></script>
<script src="quotes.js"></script>
<script>
(function(){
'use strict';
var KEY='vocabApp.v1';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- 資料 ---------- */
var D;
function blank(){return {v:1,weeks:[],stats:{},stars:0,slow:false}}
function load(){try{D=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){D=blank()}
  D.weeks=D.weeks||[];D.stats=D.stats||{};D.stars=D.stars||0;migrateEx()}
/* 舊資料（還沒有例句欄位）自動帶入內建例句；家長刪掉的（空字串）不會再自動補 */
function migrateEx(){var n=0;D.weeks.forEach(function(wk){(wk.words||[]).forEach(function(w){if(w&&w.en&&w.ex===undefined){if(fillEx(w))n++;else{w.ex='';w.exZh='';w.exForm=''}}})});if(n)try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('儲存失敗，請檢查儲存空間')}}
function allWords(){var r=[];D.weeks.forEach(function(w){w.words.forEach(function(x){r.push(x)})});return r}
function findWeek(id){return D.weeks.filter(function(w){return w.id===id})[0]}
function rec(id,ok,k){var s=D.stats[id]||(D.stats[id]={c:0,w:0});ok?s.c++:s.w++;k=(ok&&k>1)?k:1;if(k>1)s.x=(s.x||0)+k-1;s.h=String(s.h||'').concat(new Array(k+1).join(ok?'1':'0')).slice(-4);save();spLog(ok,k)}
function acc(id){var s=D.stats[id];if(!s||s.c+s.w===0)return null;return s.c/(s.c+s.w)}

/* ---------- 解析批次輸入 ---------- */
var EMO_RE;
try{EMO_RE=new RegExp('[\\p{Extended_Pictographic}\\u{1F1E6}-\\u{1F1FF}][\\u{FE0F}\\u{200D}\\p{Extended_Pictographic}\\u{1F3FB}-\\u{1F3FF}]*','gu')}
catch(e){try{EMO_RE=new RegExp('(?:[\\uD83C-\\uD83E][\\uDC00-\\uDFFF]|[\\u2600-\\u27BF])[\\uFE0F\\u200D]*','g')}catch(e2){EMO_RE=/$^/g}}
function parseLines(text){
  var out=[];
  String(text).split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var emo='';
    var em=line.match(EMO_RE);
    if(em){emo=em[0];line=line.split(em[0]).join(' ')}
    var m=line.match(/^[A-Za-z][A-Za-z'’\- ]*/);
    if(!m)return;
    var en=m[0].trim().replace(/\s+/g,' ');
    var zh=line.slice(m[0].length).replace(/^[\s,，、:：;；\t\-–=]+|[\s,，、:：;；]+$/g,'');
    if(en)out.push({id:uid()+rnd(999),en:en,zh:zh,emoji:emo});
  });
  return out;
}


/* ---------- 自動補中文與 emoji ---------- */
var DICT=null;
function dictInit(){
  if(DICT)return;DICT={};
  var raw=window.VOCAB_DICT_RAW||'';
  raw.split('\n').forEach(function(l){var p=l.split('|');if(p.length>=2&&p[0])DICT[p[0]]={zh:p[1],emoji:p[2]||''}});
}
function dictGet(k){return Object.prototype.hasOwnProperty.call(DICT,k)?DICT[k]:null}
function lookupLocal(en){dictInit();return lookupIn(dictGet,en)}
function lookupIn(get,en){
  var w=String(en||'').toLowerCase().replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ');
  if(!w)return null;
  var r=get(w);if(r)return r;
  var irr=window.VOCAB_IRREG||{};
  if(Object.prototype.hasOwnProperty.call(irr,w)){r=get(irr[w]);if(r)return r}
  var c=[];
  if(/ies$/.test(w))c.push(w.slice(0,-3)+'y');
  if(/ves$/.test(w)){c.push(w.slice(0,-3)+'f');c.push(w.slice(0,-3)+'fe')}
  if(/(s|x|z|ch|sh|o)es$/.test(w))c.push(w.slice(0,-2));
  if(/s$/.test(w))c.push(w.slice(0,-1));
  if(/ing$/.test(w)&&w.length>4){var b=w.slice(0,-3);c.push(b);c.push(b+'e');if(/(.)\1$/.test(b))c.push(b.slice(0,-1));if(/ying$/.test(w))c.push(w.slice(0,-4)+'ie')}
  if(/ed$/.test(w)&&w.length>3){var d=w.slice(0,-2);c.push(d);c.push(w.slice(0,-1));if(/(.)\1$/.test(d))c.push(d.slice(0,-1));if(/ied$/.test(w))c.push(w.slice(0,-3)+'y')}
  if(/er$/.test(w)&&w.length>3){c.push(w.slice(0,-2));c.push(w.slice(0,-1))}
  for(var i=0;i<c.length;i++){r=get(c[i]);if(r)return r}
  return null;
}
/* ---------- 例句庫 ---------- */
var SENT=null,PROPER={i:1};
function sentInit(){
  if(SENT)return;SENT={};
  String(window.VOCAB_SENT_RAW||'').split('\n').forEach(function(l){var p=l.split('|');if(p.length>=4&&p[0]){SENT[p[0]]={ex:p[1],exZh:p[2],exForm:p[3]};
    p[1].split(/\s+/).slice(1).forEach(function(t){t=t.replace(/[^A-Za-z']/g,'');if(/^[A-Z]/.test(t))PROPER[t.toLowerCase()]=1})}});
}
function sentGet(k){return Object.prototype.hasOwnProperty.call(SENT,k)?SENT[k]:null}
function sentLocal(en){sentInit();return lookupIn(sentGet,en)}
/* 在句子裡找出單字實際出現的字形（可為簡單變化形）；找不到回傳 '' */
function findForm(sent,en){
  sent=String(sent||'');var w=String(en||'').toLowerCase().replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ');if(!w||!sent)return '';
  if(/[ \-']/.test(w)){var i=sent.toLowerCase().replace(/[’‘]/g,"'").indexOf(w);return i>=0?sent.substr(i,w.length):''}
  var toks=sent.match(/[A-Za-z'’]+/g)||[];
  var irr=window.VOCAB_IRREG||{},c=[w,w+'s',w+'es',w+'ed',w+'d',w+'ing',w.replace(/y$/,'ies'),w.replace(/e$/,'ing'),w+w.slice(-1)+'ing',w+w.slice(-1)+'ed',w.replace(/y$/,'ied'),w.replace(/f$/,'ves'),w.replace(/fe$/,'ves'),w+'er',w+'est'];
  Object.keys(irr).forEach(function(k){if(irr[k]===w)c.push(k)});
  for(var j=0;j<c.length;j++){for(var t=0;t<toks.length;t++){if(toks[t].toLowerCase()===c[j])return toks[t]}}
  /* 輸入的是變化形（例如 apples），句子用原形 */
  dictInit();sentInit();var b=lookupIn(function(k){return (dictGet(k)||sentGet(k))?k:null},w);
  if(b&&b!==w)return findForm(sent,b);
  return '';
}
function hasEx(w){return !!(w&&w.ex&&String(w.ex).trim())}
function formIdx(ex,f){if(!f)return -1;var m=new RegExp("(^|[^A-Za-z'])("+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")(?![A-Za-z'])").exec(String(ex||''));return m?m.index+m[1].length:-1}
function canCloze(w){return hasEx(w)&&formIdx(w.ex,w.exForm)>=0}
function canOrder(w){if(!hasEx(w))return false;var n=orderTokens(w.ex).toks.length;return n>=3&&n<=9}
function fillEx(w){
  if(w.ex!==undefined&&w.ex!=='')return false;
  var r=sentLocal(w.en);if(!r)return false;
  w.ex=r.ex;w.exZh=r.exZh;w.exForm=findForm(r.ex,w.en)||r.exForm;(w.auto=w.auto||{}).ex=1;return true;
}

function hasPic(w){return !!(w.emoji||w.zh)}

function weight(w){var s=D.stats[w.id];if(!s)return 3;var t=s.c+s.w;var wr=s.w/t;return 1+wr*6+(t<3?1.5:0)}
function pickWord(pool,avoid){
  var c=pool.filter(function(w){return avoid.indexOf(w.id)<0});if(!c.length)c=pool;
  var tot=0;c.forEach(function(w){tot+=weight(w)});var r=Math.random()*tot;
  for(var i=0;i<c.length;i++){r-=weight(c[i]);if(r<=0)return c[i]}return c[c.length-1];
}
function startQuiz(g,sc){
  lastScope=sc;

  if(g==='cloze'||g==='order'){

  var N=g==='match'?3:g==='write'?8:(g==='cloze'||g==='order')?Math.min(8,Math.max(5,pool.filter(okFor.bind(null,g)).length*2)):10,types=[];
  for(var i=0;i<N;i++){

}
function distract(w,pool,key){
  var all=allWords().filter(function(x){return x.id!==w.id&&x.en.toLowerCase()!==w.en.toLowerCase()});
  var pref=shuffle(pool.filter(function(x){return x.id!==w.id}));
  var rest=shuffle(all.filter(function(x){return pref.indexOf(x)<0}));
  var out=pref.concat(rest);
    return out.slice(0,3);
}

function hwPath(ctx,pts,S){
  /* 點座標以畫布寬度為單位；二次曲線平滑 */
  var p=pts.map(function(q){return [q[0]*S,q[1]*S]});
  ctx.beginPath();
  if(p.length===1){ctx.arc(p[0][0],p[0][1],ctx.lineWidth/2,0,6.2832);ctx.fill();return}
  ctx.moveTo(p[0][0],p[0][1]);
  for(var i=1;i<p.length-1;i++){var mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my)}
  ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke();
}
function hwStrokes(ctx,S,lw){
  ctx.strokeStyle='#2b2250';ctx.fillStyle='#2b2250';ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  var hw=G.hw,all=hw.strokes.slice();if(hw.cur)all.push(hw.cur);

  var r=G.or;if(G.locked)return;r.bad=-1;r.ans.push(r.bank.splice(k,1)[0]);sndTap();orderDraw();
  if(!r.bank.length){
    var bad=-1;for(var i=0;i<r.ans.length;i++){if(r.toks[r.ans[i]].t.toLowerCase()!==r.toks[i].t.toLowerCase()){bad=i;break}}
    if(bad<0){G.locked=true;orderDraw();right()}
    else{r.bad=bad;sndNo();if(!G.tried){G.tried=true;rec(G.w.id,false)}orderDraw();$('#msg').textContent='順序不太對，點紅色的字拿回來再試試 💪'}
  }
}
function orderBack(k){var r=G.or;if(G.locked)return;var v=r.ans.splice(k,1)[0];r.bank.push(v);r.bad=-1;sndTap();orderDraw()}

/* 翻牌配對 */
function matchQ(){
  var cand=G.pool.slice();
  var ws=[];var tmp=cand.slice();
  while(ws.length<4&&tmp.length){ws.push(pickWord(tmp,ws.map(function(x){return x.id})));tmp=tmp.filter(function(x){return ws.indexOf(x)<0})}
  var cards=[];
  ws.forEach(function(w){cards.push({id:w.id,w:w,side:'en'});cards.push({id:w.id,w:w,side:'pic'})});
  G.m={cards:shuffle(cards),open:[],done:0,total:ws.length,bad:{}};
  matchDraw();
}
function matchDraw(){
  var m=G.m;
  app.innerHTML=qHead()+'<div class="mid">翻翻看：把英文和它的圖／中文／發音配成一對</div><div class="mgrid">'+m.cards.map(function(c,i){
    var up=m.open.indexOf(i)>=0||c.done;
    var txt=c.side==='en'?esc(c.w.en):(c.w.emoji?'<span style="font-size:48px">'+esc(c.w.emoji)+'</span>'+(c.w.zh?'<div style="font-size:18px">'+esc(c.w.zh)+'</div>':''):(c.w.zh?esc(c.w.zh):'<span style="font-size:48px">🔊</span>'));
    return '<button class="mcard'+(up?' up':'')+(c.done?' done':'')+'" data-a="flip" data-i="'+i+'">'+(up?txt:'❓')+'</button>'}).join('')+'</div><div class="msg" id="msg"></div>';
}
function onFlip(i){
  var m=G.m,c=m.cards[i];if(G.locked||c.done||m.open.indexOf(i)>=0)return;
  m.open.push(i);sndTap();if(c.side==='en'||!hasPic(c.w))say(c.w.en);matchDraw();
  if(m.open.length===2){
    var a=m.cards[m.open[0]],b=m.cards[m.open[1]];G.locked=true;
    if(a.id===b.id&&a.side!==b.side){
      a.done=b.done=true;m.done++;m.open=[];
      if(!m.bad[a.id]){rec(a.id,true);D.stars++;G.gained++;save()}
      sndOk();confetti(30);G.locked=false;matchDraw();$('#msg').textContent=praise2();
      if(m.done===m.total){G.ok++;G.first++;G.i++;sndWin();confetti(100);setTimeout(quizQ,1600)}
    }else{
      sndNo();if(!m.bad[a.id]){m.bad[a.id]=1;rec(a.id,false)}if(!m.bad[b.id]){m.bad[b.id]=1;rec(b.id,false)}
      $('#msg').textContent=tryag();
      setTimeout(function(){m.open=[];G.locked=false;matchDraw()},900);
    }
  }
}
function finish(){
  var bonus=0;if(G.first===G.types.length&&G.types.length>=3){bonus=3;D.stars+=3;G.gained+=3}
  save();view='result';sndWin();confetti(160);render();
  spSync().then(function(){var g=G;setTimeout(function(){if(view==='result'&&!spCheck())qvMaybe(g)},1400)});
}
function result(){
  var n=G.types.length,p=G.first/n;
  var face=p>=.9?'🏆':p>=.6?'🎉':'💪';
  app.innerHTML=topbar(false)+'<div class="hero pop">'+face+'</div><h1>'+(p>=.9?'太厲害了！':p>=.6?'表現很棒！':'再接再厲！')+'</h1>'+
  '<div class="card mid" style="font-size:30px">第一次就答對：<b>'+G.first+' / '+n+'</b><br>這次獲得：<b style="color:#e08a00">⭐ '+G.gained+'</b>'+(G.first===n&&n>=3?'<br>全對獎勵 +3 ⭐':'')+'</div>'+
  '<div class="grid g2"><button class="btn green" data-a="again">🔁 再玩一次</button><button class="btn blue" data-a="home">🏠 回首頁</button></div>';
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;ac();
  switch(a){
    case 'sptake':spTake();break;
    case 'qvclose':{var qo=$('#qvov');if(qo)qo.remove();break}
    case 'closenotice':$('#notice').style.display='none';break;
    case 'home':go('home');break;
    case 'parent':go('parent');break;
    case 'io':go('io');break;
    case 'learn':learn();break;
    case 'quizmenu':go('quizmenu');break;
    case 'say':say(el.dataset.t,!!el.dataset.s);break;
    case 'addweek':{
      var ws=parseLines($('#batch').value);if(!ws.length){toast('請輸入至少一個英文單字');return}
      fillWords(ws,false);
      var nwk={id:uid(),name:$('#wkname').value.trim()||('第'+(D.weeks.length+1)+'週'),words:ws};D.weeks.push(nwk);save();toast('已加入 '+ws.length+' 個單字');parent();
      bgFill(nwk,ws);break}
    case 'addto':editWeek=editWeek===el.dataset.id?null:el.dataset.id;parent();break;
    case 'savemore':{var wk=findWeek(el.dataset.id),nw=parseLines($('#more').value);fillWords(nw,false);wk.words=wk.words.concat(nw);save();editWeek=null;toast('已補上 '+nw.length+' 個');parent();bgFill(wk,nw);break}
    case 'fillweek':{var fw=findWeek(el.dataset.id);if(!fw)break;toast('補齊中…');
      var tgt=fw.words.filter(isMiss);
      fillWords(tgt,true).then(function(st){save();if(view==='parent')parent();notice(fillReport(st))});break}
    case 'rename':{var wk2=findWeek(el.dataset.id),nm=prompt('新的週名稱',wk2.name);if(nm){wk2.name=nm;save();parent()}break}
    case 'delweek':if(confirm('確定刪除這一週的所有單字？')){D.weeks=D.weeks.filter(function(w){return w.id!==el.dataset.id});save();parent()}break;
    case 'delw':D.weeks.forEach(function(w){w.words=w.words.filter(function(x){return x.id!==el.dataset.id})});delete D.stats[el.dataset.id];save();parent();break;
    case 'editw':D.weeks.forEach(function(w){w.words.forEach(function(x){
      if(x.id===el.dataset.id){var en=prompt('英文',x.en);if(en===null)return;var zh=prompt('中文意思（可留白）',x.zh||'');var em=prompt('emoji（可留白）',x.emoji||'');
        var nz=(zh||'').trim(),ne=(em||'').trim();if(x.auto){if(nz!==(x.zh||''))delete x.auto.zh;if(ne!==(x.emoji||''))delete x.auto.emoji}
        if(en.trim())x.en=en.trim();x.zh=nz;x.emoji=ne;if(hasEx(x))x.exForm=findForm(x.ex,x.en);save()}})});parent();break;
    case 'resetstats':if(confirm('確定清除答題紀錄與星星？')){D.stats={};D.stars=0;save();parent()}break;
    case 'exportfile':{
      var blob=new Blob([exportText()],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
      l.href=u;l.download='vocab-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('若沒有下載，請改用「複製文字代碼」');break}
    case 'exportcopy':{
      var t=exportText(),ta=$('#code');ta.value=t;ta.removeAttribute('readonly');ta.focus();ta.select();ta.setSelectionRange(0,t.length);
      var ok=false;try{ok=document.execCommand('copy')}catch(x){}
      if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('已複製')},function(){});
      ta.setAttribute('readonly','');toast(ok?'已複製！到另一台貼上即可':'請長按文字全選後拷貝');break}
    case 'import':{
      var txt=$('#paste').value;
      if(txt.trim()){doImport(txt,el.dataset.m)}
      else{var f=$('#file').files[0];if(!f){toast('請選擇檔案或貼上代碼');return}
        var r=new FileReader();r.onload=function(){doImport(String(r.result),el.dataset.m)};r.readAsText(f)}
      break}
    case 'start':{var sc=$('#scope').value;startQuiz(el.dataset.g,sc);break}
    case 'again':startQuiz(G.g,lastScope);break;
    case 'quit':if(confirm('要結束這次挑戰嗎？')){G=null;go('home')}break;
    case 'ans':onAns(+el.dataset.i);break;
    case 'tile':onTile(+el.dataset.k);break;
    case 'spellundo':spellUndo();break;
    case 'hwundo':if(G&&G.hw&&!G.locked){G.hw.strokes.pop();hwRedraw()}break;
    case 'hwclear':if(G&&G.hw&&!G.locked){G.hw.strokes=[];G.hw.cur=null;hwRedraw()}break;
    case 'hwhint':hwHint();break;
    case 'hwreveal':hwDone();break;
    case 'hwmanual':hwReveal();break;
    case 'hwok':hwOk();break;
    case 'hwretry':hwRetry();break;
    case 'flip':onFlip(+el.dataset.i);break;
    case 'clans':clozeAns(+el.dataset.i);break;
    case 'clsay':clozeSay(!!el.dataset.s);break;
    case 'orpick':orderPick(+el.dataset.k);break;
    case 'orback':orderBack(+el.dataset.k);break;
    case 'orsay':if(G&&G.w)sayParts([G.w.ex],!!el.dataset.s);break;
    case 'sayex':{var lw=wordById(el.dataset.id);if(!lw)break;var slw=!!el.dataset.s;sayParts(hasEx(lw)?(slw?[lw.ex]:[lw.en,lw.ex]):[lw.en],slw);break}
    case 'editex':{var xw=wordById(el.dataset.id);if(!xw)break;
      var se=prompt('「'+xw.en+'」的例句（英文，要包含這個字；留白＝不用例句）',xw.ex||'');if(se===null)break;se=se.trim().replace(/\s+/g,' ');
      if(!se){xw.ex='';xw.exZh='';xw.exForm='';if(xw.auto)delete xw.auto.ex;save();parent();toast('已移除例句');break}
      var sz=prompt('例句的中文翻譯（可留白）',se===xw.ex?(xw.exZh||''):'');if(sz===null)break;
      var changed=se!==xw.ex||sz.trim()!==(xw.exZh||'');
      xw.ex=se;xw.exZh=sz.trim();xw.exForm=findForm(se,xw.en);if(changed&&xw.auto)delete xw.auto.ex;save();parent();
      toast(xw.exForm?'例句已儲存':'句子裡找不到「'+xw.en+'」，這句只會用在學習卡和排排看');break}
  }
});
document.addEventListener('change',function(e){if(e.target.id==='penonly'){D.penOnly=e.target.checked;save();toast(D.penOnly?'只有 Apple Pencil 會寫字':'手指和筆都可以寫')}if(e.target.id==='hwocr'){D.hwOcr=e.target.checked;save();toast(D.hwOcr?'手寫自動辨識：開':'手寫自動辨識：關')}if(e.target.id==='slow'){D.slow=e.target.checked;save();if(D.slow)say('apple')}});
window.addEventListener('resize',function(){if(G&&G.hw&&G.hw.phase==='write')hwSize();var c=$('#fx');c.width=innerWidth;c.height=innerHeight});

/* 測試用匯出 */
window.__vocab={parseLines:parseLines,findForm:findForm,sentLocal:sentLocal,orderTokens:orderTokens};
load();render();
spSync();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
window.__vocabDebug={OCR:OCR,hwOcrImage:hwOcrImage,hwResult:hwResult,getG:function(){return G},setG:function(g){G=g},D:function(){return D},x:{ev:spEval,ck:spCheck,qv:qvMaybe,wt:spWt,take:spTake,sync:spSync,dec:spDecode,learned:spLearned}};
})();
