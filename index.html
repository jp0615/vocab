<script>
(function(){
'use strict';
var KEY='vocabApp.v1';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- 資料 ---------- */
var D;
function blank(){return {v:1,weeks:[],stats:{},stars:0,slow:false}}
function load(){try{D=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){D=blank()}
  D.weeks=D.weeks||[];D.stats=D.stats||{};D.stars=D.stars||0;migrateEx()}
/* 舊資料（還沒有例句欄位）自動帶入內建例句；家長刪掉的（空字串）不會再自動補 */
function migrateEx(){var n=0;D.weeks.forEach(function(wk){(wk.words||[]).forEach(function(w){if(w&&w.en&&w.ex===undefined){if(fillEx(w))n++;else{w.ex='';w.exZh='';w.exForm=''}}})});if(n)try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('儲存失敗，請檢查儲存空間')}}
function allWords(){var r=[];D.weeks.forEach(function(w){w.words.forEach(function(x){r.push(x)})});return r}
function findWeek(id){return D.weeks.filter(function(w){return w.id===id})[0]}
function rec(id,ok,k){try{gPre(id)}catch(e){}var s=D.stats[id]||(D.stats[id]={c:0,w:0});ok?s.c++:s.w++;s.ls=Date.now();k=(ok&&k>1)?k:1;if(k>1)s.x=(s.x||0)+k-1;s.h=String(s.h||'').concat(new Array(k+1).join(ok?'1':'0')).slice(-4);try{var fr=ok?fkOk(vfL(),id):(fkMiss(vfL(),id),0);if(G&&G.fix&&G.fres&&!(id in G.fres))G.fres[id]=ok?(fr===1?1:2):0}catch(e){}save();if(!(G&&G.fix))spLog(ok,k);try{gPost(id,ok)}catch(e){}}
function acc(id){var s=D.stats[id];if(!s||s.c+s.w===0)return null;return s.c/(s.c+s.w)}

/* ---------- 解析批次輸入 ---------- */
var EMO_RE;
try{EMO_RE=new RegExp('[\\p{Extended_Pictographic}\\u{1F1E6}-\\u{1F1FF}][\\u{FE0F}\\u{200D}\\p{Extended_Pictographic}\\u{1F3FB}-\\u{1F3FF}]*','gu')}
catch(e){try{EMO_RE=new RegExp('(?:[\\uD83C-\\uD83E][\\uDC00-\\uDFFF]|[\\u2600-\\u27BF])[\\uFE0F\\u200D]*','g')}catch(e2){EMO_RE=/$^/g}}
function parseLines(text){
  var out=[];
  String(text).split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var emo='';
    var em=line.match(EMO_RE);
    if(em){emo=em[0];line=line.split(em[0]).join(' ')}
    var m=line.match(/^[A-Za-z][A-Za-z'’\- ]*/);
    if(!m)return;
    var en=m[0].trim().replace(/\s+/g,' ');
    var zh=line.slice(m[0].length).replace(/^[\s,，、:：;；\t\-–=]+|[\s,，、:：;；]+$/g,'');
    if(en)out.push({id:uid()+rnd(999),en:en,zh:zh,emoji:emo});
  });
  return out;
}


/* ---------- 自動補中文與 emoji ---------- */
var DICT=null;
function dictInit(){
  if(DICT)return;DICT={};
  var raw=window.VOCAB_DICT_RAW||'';
  raw.split('\n').forEach(function(l){var p=l.split('|');if(p.length>=2&&p[0])DICT[p[0]]={zh:p[1],emoji:p[2]||''}});
}
function dictGet(k){return Object.prototype.hasOwnProperty.call(DICT,k)?DICT[k]:null}
function lookupLocal(en){dictInit();return lookupIn(dictGet,en)}
function lookupIn(get,en){
  var w=String(en||'').toLowerCase().replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ');
  if(!w)return null;
  var r=get(w);if(r)return r;
  var irr=window.VOCAB_IRREG||{};
  if(Object.prototype.hasOwnProperty.call(irr,w)){r=get(irr[w]);if(r)return r}
  var c=[];
  if(/ies$/.test(w))c.push(w.slice(0,-3)+'y');
  if(/ves$/.test(w)){c.push(w.slice(0,-3)+'f');c.push(w.slice(0,-3)+'fe')}
  if(/(s|x|z|ch|sh|o)es$/.test(w))c.push(w.slice(0,-2));
  if(/s$/.test(w))c.push(w.slice(0,-1));
  if(/ing$/.test(w)&&w.length>4){var b=w.slice(0,-3);c.push(b);c.push(b+'e');if(/(.)\1$/.test(b))c.push(b.slice(0,-1));if(/ying$/.test(w))c.push(w.slice(0,-4)+'ie')}
  if(/ed$/.test(w)&&w.length>3){var d=w.slice(0,-2);c.push(d);c.push(w.slice(0,-1));if(/(.)\1$/.test(d))c.push(d.slice(0,-1));if(/ied$/.test(w))c.push(w.slice(0,-3)+'y')}
  if(/er$/.test(w)&&w.length>3){c.push(w.slice(0,-2));c.push(w.slice(0,-1))}
  for(var i=0;i<c.length;i++){r=get(c[i]);if(r)return r}
  return null;
}
/* ---------- 例句庫 ---------- */
var SENT=null,PROPER={i:1};
function sentInit(){
  if(SENT)return;SENT={};
  String(window.VOCAB_SENT_RAW||'').split('\n').forEach(function(l){var p=l.split('|');if(p.length>=4&&p[0]){SENT[p[0]]={ex:p[1],exZh:p[2],exForm:p[3]};
    p[1].split(/\s+/).slice(1).forEach(function(t){t=t.replace(/[^A-Za-z']/g,'');if(/^[A-Z]/.test(t))PROPER[t.toLowerCase()]=1})}});
}
function sentGet(k){return Object.prototype.hasOwnProperty.call(SENT,k)?SENT[k]:null}
function sentLocal(en){sentInit();return lookupIn(sentGet,en)}
/* 在句子裡找出單字實際出現的字形（可為簡單變化形）；找不到回傳 '' */
function findForm(sent,en){
  sent=String(sent||'');var w=String(en||'').toLowerCase().replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ');if(!w||!sent)return '';
  if(/[ \-']/.test(w)){var i=sent.toLowerCase().replace(/[’‘]/g,"'").indexOf(w);return i>=0?sent.substr(i,w.length):''}
  var toks=sent.match(/[A-Za-z'’]+/g)||[];
  var irr=window.VOCAB_IRREG||{},c=[w,w+'s',w+'es',w+'ed',w+'d',w+'ing',w.replace(/y$/,'ies'),w.replace(/e$/,'ing'),w+w.slice(-1)+'ing',w+w.slice(-1)+'ed',w.replace(/y$/,'ied'),w.replace(/f$/,'ves'),w.replace(/fe$/,'ves'),w+'er',w+'est'];
  Object.keys(irr).forEach(function(k){if(irr[k]===w)c.push(k)});
  for(var j=0;j<c.length;j++){for(var t=0;t<toks.length;t++){if(toks[t].toLowerCase()===c[j])return toks[t]}}
  /* 輸入的是變化形（例如 apples），句子用原形 */
  dictInit();sentInit();var b=lookupIn(function(k){return (dictGet(k)||sentGet(k))?k:null},w);
  if(b&&b!==w)return findForm(sent,b);
  return '';
}
function hasEx(w){return !!(w&&w.ex&&String(w.ex).trim())}
function formIdx(ex,f){if(!f)return -1;var m=new RegExp("(^|[^A-Za-z'])("+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")(?![A-Za-z'])").exec(String(ex||''));return m?m.index+m[1].length:-1}
function canCloze(w){return hasEx(w)&&formIdx(w.ex,w.exForm)>=0}
function canOrder(w){if(!hasEx(w))return false;var n=orderTokens(w.ex).toks.length;return n>=3&&n<=9}
function fillEx(w){
  if(w.ex!==undefined&&w.ex!=='')return false;
  var r=sentLocal(w.en);if(!r)return false;
  w.ex=r.ex;w.exZh=r.exZh;w.exForm=findForm(r.ex,w.en)||r.exForm;(w.auto=w.auto||{}).ex=1;return true;
}
var S2T={'个':'個','们':'們','这':'這','么':'麼','对':'對','国':'國','学':'學','马':'馬','鸟':'鳥','鱼':'魚','车':'車','门':'門','见':'見','开':'開','关':'關','说':'說','话':'話','读':'讀','书':'書','买':'買','卖':'賣','红':'紅','绿':'綠','蓝':'藍','黄':'黃','鸡':'雞','猪':'豬','虾':'蝦','龙':'龍','爱':'愛','时':'時','间':'間','风':'風','云':'雲','电':'電','脑':'腦','视':'視','机':'機','飞':'飛','灯':'燈','热':'熱','节':'節','乐':'樂','声':'聲','头':'頭','脸':'臉','脚':'腳','颜':'顏','点':'點','别':'別','东':'東','长':'長','岁':'歲','样':'樣','认':'認','识':'識','应':'應','该':'該','让':'讓','给':'給','过':'過','还':'還','进':'進','远':'遠','运':'運','动':'動','园':'園','围':'圍','图':'圖','画':'畫','体':'體','处':'處','师':'師','养':'養','优':'優','儿':'兒','兰':'蘭','刚':'剛','刘':'劉','务':'務','员':'員','问':'問','启':'啟','听':'聽','吗':'嗎','响':'響','复':'復','够':'夠','实':'實','宝':'寶','将':'將','尔':'爾','层':'層','岛':'島','带':'帶','广':'廣','庆':'慶','当':'當','录':'錄','忆':'憶','总':'總','恶':'惡','户':'戶','护':'護','报':'報','挂':'掛','换':'換','数':'數','无':'無','旧':'舊','显':'顯','晓':'曉','暂':'暫','术':'術','杂':'雜','来':'來','极':'極','标':'標','树':'樹','桥':'橋','检':'檢','梦':'夢','汉':'漢','温':'溫','湿':'濕','灭':'滅','烦':'煩','爷':'爺','猫':'貓','独':'獨','现':'現','种':'種','称':'稱','笔':'筆','简':'簡','类':'類','纸':'紙','经':'經','结':'結','绘':'繪','网':'網','罗':'羅','义':'義','习':'習','业':'業','虫':'蟲','蚂':'螞','蜗':'蝸','袜':'襪','裤':'褲','览':'覽','诉':'訴','请':'請','谢':'謝','证':'證','试':'試','询':'詢','译':'譯','贝':'貝','负':'負','财':'財','货':'貨','质':'質','贵':'貴','费':'費','赛':'賽','赢':'贏','输':'輸','边':'邊','达':'達','迟':'遲','选':'選','钟':'鐘','钱':'錢','铃':'鈴','银':'銀','锁':'鎖','镜':'鏡','阳':'陽','阴':'陰','陆':'陸','队':'隊','随':'隨','难':'難','雾':'霧','页':'頁','颗':'顆','饭':'飯','饮':'飲','饼':'餅','馆':'館','验':'驗','骑':'騎','鲸':'鯨','鸭':'鴨','鹅':'鵝','鹰':'鷹','麦':'麥','齐':'齊','齿':'齒','龟':'龜','妈':'媽','号':'號','码':'碼','块':'塊','楼':'樓','厅':'廳','厨':'廚','厕':'廁','药':'藥','医':'醫','烧':'燒','痒':'癢','肠':'腸','胆':'膽','脏':'臟','颈':'頸','耸':'聳','环':'環','线':'線','针':'針','钉':'釘','锤':'錘','铁':'鐵','铅':'鉛','胶':'膠','剧':'劇','戏':'戲','赏':'賞','奖':'獎','盘':'盤','汤':'湯','粮':'糧','灿':'燦','虑':'慮','礼':'禮','纪':'紀','约':'約','级':'級','组':'組','细':'細','织':'織','练':'練','绍':'紹','继':'繼','续':'續','缘':'緣','闹':'鬧','闻':'聞','阅':'閱','陈':'陳','顶':'頂','顺':'順','须':'須','顾':'顧','预':'預','领':'領','频':'頻','题':'題','飘':'飄','馈':'饋','惊':'驚','讶':'訝','讨':'討','厌':'厭','设':'設','访':'訪','评':'評','诗':'詩','语':'語','误':'誤','调':'調','谈':'談','谁':'誰','论':'論','贺':'賀','资':'資','购':'購','赚':'賺','跃':'躍','轮':'輪','轻':'輕','载':'載','辆':'輛','较':'較','适':'適','遗':'遺','邮':'郵','邻':'鄰','释':'釋','鲜':'鮮','鳄':'鱷','鸽':'鴿','鹦':'鸚','鹉':'鵡','兽':'獸','狮':'獅','猎':'獵','狈':'狽','状':'狀','与':'與','丝':'絲','两':'兩','严':'嚴','丽':'麗','乡':'鄉','亲':'親','仅':'僅','从':'從','仓':'倉','价':'價','众':'眾','传':'傳','伤':'傷','侧':'側','兴':'興','写':'寫','冻':'凍','净':'淨','减':'減','凑':'湊','击':'擊','划':'劃','则':'則','刮':'颳','创':'創','办':'辦','势':'勢','参':'參','双':'雙','变':'變','叶':'葉','吓':'嚇','团':'團','坏':'壞','坛':'壇','场':'場','坚':'堅','垫':'墊','夹':'夾','奋':'奮','妇':'婦'};
function toTrad(t){
  var o='';
  for(var i=0;i<t.length;i++){var ch=t.charAt(i);o+=S2T.hasOwnProperty(ch)?S2T[ch]:ch}
  return o;
}
var TR_KEY='vocabApp.trcache.v1',TRC=null;
function trLoad(){if(TRC)return;try{TRC=JSON.parse(localStorage.getItem(TR_KEY))||{}}catch(e){TRC={}}}
function trSave(){try{localStorage.setItem(TR_KEY,JSON.stringify(TRC))}catch(e){}}
function cleanZh(t){
  if(typeof t!=='string')return '';
  t=t.trim();
  if(!t||t.length>14)return '';
  if(/[A-Za-z]/.test(t))return '';          /* 還含英文：可能是警告或沒翻成功 */
  if(!/[\u4e00-\u9fff]/.test(t))return '';
  return toTrad(t).replace(/[。\.]+$/,'');
}
function fetchTimeout(url,ms){
  return new Promise(function(res,rej){
    var done=false,t=setTimeout(function(){if(!done){done=true;rej(new Error('timeout'))}},ms);
    fetch(url).then(function(r){if(done)return;done=true;clearTimeout(t);res(r)},function(e){if(done)return;done=true;clearTimeout(t);rej(e)});
  });
}
/* 回傳 Promise，永遠 resolve：字串（中文）或 ''（查不到／離線／出錯） */
function lookupNet(en){
  trLoad();
  var k=String(en||'').toLowerCase().trim();
  if(!k||k.split(' ').length>3)return Promise.resolve('');
  if(TRC.hasOwnProperty(k)&&TRC[k])return Promise.resolve(TRC[k]);
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return Promise.resolve('');
  if(typeof fetch!=='function')return Promise.resolve('');
  var url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|zh-TW';
  return fetchTimeout(url,7000).then(function(r){if(!r.ok)throw new Error('http');return r.json()}).then(function(j){
    if(!j||String(j.responseStatus)!=='200'||!j.responseData)return '';
    var z=cleanZh(j.responseData.translatedText);
    if(z){TRC[k]=z;trSave()}
    return z;
  }).catch(function(){return ''});
}
/* 先用字典補；有 net 為 true 時，缺中文的再上網查。回傳 Promise<{zh,emoji,miss}> 補上的數量 */
function fillWords(words,useNet){
  var st={zh:0,emoji:0,miss:0};
  st.ex=0;
  words.forEach(function(w){
    if(fillEx(w))st.ex++;
    var r=lookupLocal(w.en);
    if(r){
      if(!w.zh&&r.zh){w.zh=r.zh;(w.auto=w.auto||{}).zh=1;st.zh++}
      if(!w.emoji&&r.emoji){w.emoji=r.emoji;(w.auto=w.auto||{}).emoji=1;st.emoji++}
    }
  });
  var need=words.filter(function(w){return !w.zh});
  var p=Promise.resolve();
  if(useNet!==false&&need.length){
    need.forEach(function(w){p=p.then(function(){return lookupNet(w.en).then(function(z){if(z&&!w.zh){w.zh=z;(w.auto=w.auto||{}).zh=1;st.zh++}})})});
  }
  return p.then(function(){words.forEach(function(w){if(!w.zh)st.miss++});return st});
}
function isMiss(w){if(!w.zh)return true;if(!hasEx(w)&&sentLocal(w.en))return true;if(!w.emoji){var r=lookupLocal(w.en);return !!(r&&r.emoji)}return false}
function missCount(wk){return wk.words.filter(isMiss).length}
function fillReport(st){
  var m='✨ 自動補上：中文 '+st.zh+' 個、圖 '+st.emoji+' 個、例句 '+(st.ex||0)+' 個';
  if(st.miss)m+='；還有 '+st.miss+' 個查不到中文，可以按「編輯」自己填';
  return m;
}

/* 新增後在背景上網補查字典沒有的中文（沒網路就略過），完成後更新畫面 */
function bgFill(wk,ws){
  var need=ws.filter(function(w){return !w.zh});
  if(!need.length)return;
  fillWords(need,true).then(function(st){if(st.zh>0){save();if(view==='parent')parent();toast('✨ 上網又補上 '+st.zh+' 個中文')}}).catch(function(){});
}

/* ---------- 發音 ---------- */
var voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices()||[];
  var us=vs.filter(function(v){return /en[-_]US/i.test(v.lang)});
  voice=us.filter(function(v){return /samantha|ava|allison|nicky/i.test(v.name)})[0]||us[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,forceSlow){
  if(!('speechSynthesis' in window)){toast('這台裝置不支援發音');return}
  try{
    spSeq++;speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice)u.voice=voice;
    u.rate=(D.slow||forceSlow)?0.55:0.9;u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

var spSeq=0;
/* 依序唸：parts 為字串或 'BEEP'（挖空處嗶一聲） */
function sayParts(parts,slow,done){
  if(!('speechSynthesis' in window)){toast('這台裝置不支援發音');return}
  var my=++spSeq;try{speechSynthesis.cancel()}catch(e){}
  var i=0;
  function next(){
    if(my!==spSeq)return;
    if(i>=parts.length){if(done)done();return}
    var p=parts[i++];
    if(p==='BEEP'){tone(880,0,.35,'sine',.2);setTimeout(next,650);return}
    p=String(p).trim();if(!p||!/[A-Za-z0-9]/.test(p)){next();return}
    var fired=false;function fin(){if(fired)return;fired=true;clearTimeout(g);setTimeout(next,150)}
    var g;
    try{var u=new SpeechSynthesisUtterance(p);u.lang='en-US';if(voice)u.voice=voice;u.rate=(D.slow||slow)?0.55:0.85;u.pitch=1.05;
      u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin();return}
    g=setTimeout(fin,1500+p.length*(slow||D.slow?190:110)); /* 部分裝置 onend 不觸發的保險 */
  }
  next();
}
function wordById(id){var r=null;D.weeks.forEach(function(wk){wk.words.forEach(function(x){if(x.id===id)r=x})});return r}

/* ---------- 音效 ---------- */
var AC=null;
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;
  var s=a.currentTime+t0;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.25,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.05)}

/* ---------- 💧 幫花澆水：答錯的字會在清單裡等你；隔天以後再答對，花才會完全恢復精神 ---------- */
/* ---- 修補清單共用核心：答錯的題目先記下來；要在「比答錯那天更晚的一天」再答對才離開清單（台灣時間），最多留最新 20 個 ---- */
var FK_CAP=20,FK_RE=/^\d{4}-\d{2}-\d{2}$/;
function fkDay(t){return new Date((t==null?Date.now():+t)+288e5).toISOString().slice(0,10)}
function fkCap(o){var ks=Object.keys(o);if(ks.length>FK_CAP){ks.sort(function(a,b){return (o[b].t-o[a].t)||(o[b].m>o[a].m?1:o[b].m<o[a].m?-1:0)});ks.slice(FK_CAP).forEach(function(k){delete o[k]})}return o}
function fkClean(o){var r={};if(!o||typeof o!=='object'||Array.isArray(o))return r;
  Object.keys(o).forEach(function(k){var e=o[k];if(!e||typeof e!=='object'||!FK_RE.test(String(e.m||'')))return;
    var x={m:String(e.m),t:Math.max(0,+e.t||0),p:FK_RE.test(String(e.p||''))?String(e.p):''};if(x.p&&x.p<x.m)x.p='';if(e.q!==undefined)x.q=e.q;r[k]=x});
  return fkCap(r)}
function fkMiss(L,k,q){var e=L[k]||{};e.m=fkDay();e.t=Date.now();e.p='';if(q!==undefined)e.q=q;L[k]=e;fkCap(L);return e}
/* 答對：0＝不在清單、1＝今天有進步（明天再來）、2＝修好了（離開清單） */
function fkOk(L,k){var e=L[k];if(!e)return 0;var d=fkDay();if(d>e.m){delete L[k];return 2}e.p=d;return 1}
function fkDue(e){return !!e&&e.p!==fkDay()}
function fkMerge(a,b){a=fkClean(a);b=fkClean(b);
  Object.keys(b).forEach(function(k){var x=a[k],y=b[k];if(!x){a[k]=y;return}
    var m=x.m>y.m?x.m:y.m,p=x.p>y.p?x.p:y.p,z={m:m,t:Math.max(x.t,y.t),p:p>=m?p:''};
    if(x.q!==undefined||y.q!==undefined)z.q=(y.t>x.t&&y.q!==undefined)?y.q:(x.q!==undefined?x.q:y.q);a[k]=z});
  return fkCap(a)}
var VF_ROUND=10,VF_MIN=5;
function vfL(){if(!D.fix||typeof D.fix!=='object'||Array.isArray(D.fix))D.fix={};return D.fix}
/* 第一次升級：把「上次答錯」的字放進清單（答錯日＝上次練習那天） */
function vfSeed(){if(D.fixv)return;D.fixv=1;var L=vfL();
  allWords().forEach(function(w){var s=D.stats[w.id];if(s&&!L[w.id]&&String(s.h||'').slice(-1)==='0'){var t=+s.ls||Date.now();L[w.id]={m:fkDay(t),t:t,p:''}}});fkCap(L);save()}
function vfStale(id){var s=D.stats[id];return !!(s&&+s.ls&&(Date.now()-s.ls)/864e5>=GWILT&&gStage(id)>=1)}
function vfInfo(){var L=vfL(),td=fkDay(),r={due:[],done:0,stale:[]},seen={};
  allWords().forEach(function(w){if(seen[w.id])return;seen[w.id]=1;var e=L[w.id];
    if(e){if(e.p===td)r.done++;else r.due.push(w)}else if(vfStale(w.id))r.stale.push(w)});
  r.due.sort(function(a,b){return L[a.id].t-L[b.id].t});
  r.stale.sort(function(a,b){return (+D.stats[a.id].ls||0)-(+D.stats[b.id].ls||0)});return r}
function vfPlan(){var f=vfInfo(),p=f.due.slice(0,VF_ROUND);for(var i=0;p.length<VF_MIN&&i<f.stale.length;i++)p.push(f.stale[i]);return p}
var VF_CAN='<svg viewBox="0 0 80 60" aria-hidden="true"><path d="M50 30 L71 15 l5 5 -21 19z" fill="#8fd0ff" stroke="#6b4f3a" stroke-width="2.5" stroke-linejoin="round"/><path d="M69 12 l9 9" stroke="#6b4f3a" stroke-width="4" stroke-linecap="round"/><path d="M20 24 q13 -18 26 0" fill="none" stroke="#6b4f3a" stroke-width="3.5" stroke-linecap="round"/><path d="M12 24 h40 a3 3 0 0 1 3 3 v19 a8 8 0 0 1 -8 8 h-30 a8 8 0 0 1 -8 -8 v-19 a3 3 0 0 1 3 -3z" fill="#7cc6ff" stroke="#6b4f3a" stroke-width="2.5"/><path d="M16 34 h36" stroke="#fff" stroke-width="3" opacity=".6"/><circle cx="24" cy="44" r="3" fill="#fff" opacity=".75"/></svg>';
/* 首頁／島上的入口 */

  if(n||m)return '<button class="vfbtn gf" data-a="fix"><span class="vfcan">'+VF_CAN+'</span><span class="vft"><b>💧 幫花澆水</b><small>'+(n?'還有 '+n+' 朵花等你澆水':m>VF_ROUND?'有幾朵花好久沒見了，來澆澆水吧':'有 '+m+' 朵花好久沒見，有點口渴了')+'</small></span></button>';

  return ''}

  app.innerHTML=topbar(false)+'<div class="card grc">'+drops+'<div class="grt">💧 澆水完成！</div><div class="grs">'+items.join('')+'</div>'+

    '<div class="grid g2">'+(f.due.length?'<button class="btn green" data-a="fix">💧 繼續澆水</button>':'<button class="btn" style="background:#ff8fb1;box-shadow:0 6px 0 #d0457a" data-a="garden">🌸 去Ante島看看</button>')+'<button class="btn blue" data-a="home">🏠 回首頁</button></div>'}

/* 匯出：學習資料全部帶走（單字、答題紀錄、星星、設定、範圍、台詞輪替）；不含系統同步狀態 */
function exportText(){var o={},k;for(k in D)o[k]=D[k];o.app='vocab';o.fmt=2;o.exported=new Date().toISOString();
  try{o.scope=localStorage.getItem(SC_KEY)||lastScope}catch(e){o.scope=lastScope}
  try{var q=JSON.parse(localStorage.getItem(QV_KEY));if(q&&typeof q==='object')o.qv=q}catch(e){}
  try{o.garden=gExport()}catch(e){}
  return JSON.stringify(o)}
function cleanStat(s){if(!s||typeof s!=='object')return null;var r={c:+s.c||0,w:+s.w||0};if(+s.ls)r.ls=+s.ls;if(+s.x)r.x=+s.x;if(s.h!==undefined)r.h=String(s.h||'').replace(/[^01]/g,'').slice(-4);return r}
function statN(s){return s?(+s.c||0)+(+s.w||0):-1}
/* 同一個字兩邊都有紀錄：取作答次數多的那份（一樣多就取最近練習的），不相加以免重複計算 */
function pickStat(a,b){if(!a)return b;if(!b)return a;var na=statN(a),nb=statN(b);if(nb!==na)return nb>na?b:a;return (+b.ls||0)>(+a.ls||0)?b:a}
var EXTRA_KEYS={app:1,fmt:1,exported:1,scope:1,qv:1,garden:1};
function doImport(txt,mode){
  var o;try{o=JSON.parse(String(txt).trim())}catch(e){toast('格式不正確，請確認內容完整');return}
  if(o&&o.app==='vocab'&&o.data&&!o.weeks)o=o.data;
  if(!o||!Array.isArray(o.weeks)){toast('這不是單字資料');return}
  o.weeks.forEach(function(w){w.words=(w.words||[]).filter(function(x){return x&&x.en})});
  var nWords=0;o.weeks.forEach(function(w){nWords+=w.words.length});
  var st={};Object.keys(o.stats&&typeof o.stats==='object'?o.stats:{}).forEach(function(k){var c=cleanStat(o.stats[k]);if(c)st[k]=c});
  var hasStars=o.stars!==undefined&&o.stars!==null,inStars=Math.max(0,Math.floor(+o.stars||0)),added=0;
  if(mode==='replace'){
    if(!confirm('確定要用匯入的資料取代目前全部資料嗎？'))return;
    var nd=blank(),k;for(k in o)if(!EXTRA_KEYS[k])nd[k]=o[k];nd.stats=st;nd.stars=inStars;D=nd;added=nWords;
  }else{
    o.weeks.forEach(function(w){
      var ex=findWeek(w.id);
      if(!ex){D.weeks.push(w);added+=w.words.length}else{var have={};ex.words.forEach(function(x){have[x.id]=1});w.words.forEach(function(x){if(!have[x.id]){ex.words.push(x);added++}else{var cur=ex.words.filter(function(y){return y.id===x.id})[0];if(cur&&!hasEx(cur)&&hasEx(x)){cur.ex=x.ex;cur.exZh=x.exZh||'';cur.exForm=x.exForm||findForm(x.ex,cur.en);if(x.auto&&x.auto.ex)(cur.auto=cur.auto||{}).ex=1;else if(cur.auto)delete cur.auto.ex}}})}
    });
    Object.keys(st).forEach(function(k){D.stats[k]=pickStat(D.stats[k],st[k])});
    D.stars=Math.max(+D.stars||0,inStars);
    D.fix=fkMerge(D.fix,o.fix);if(o.fixv)D.fixv=1;
  }
  /* 範圍與台詞輪替（新版代碼才有） */
  if(typeof o.scope==='string'&&mode==='replace'){lastScope=o.scope;try{localStorage.setItem(SC_KEY,o.scope);localStorage.setItem(SC_KEY+'.m','1')}catch(e){}}
  if(o.qv&&typeof o.qv==='object'){try{var cq={};if(mode!=='replace'){cq=JSON.parse(localStorage.getItem(QV_KEY))||{}}
    var q={k:Math.max(+cq.k||0,+o.qv.k||0),last:(+o.qv.at||0)>=(+cq.at||0)?o.qv.last:cq.last,at:Math.max(+cq.at||0,+o.qv.at||0)};localStorage.setItem(QV_KEY,JSON.stringify(q))}catch(e){}}
  if(!scopeOk(lastScope))lastScope='mixrev';
  D.fix=fkClean(D.fix);migrateEx();save();try{vfSeed()}catch(e){}try{gImport(o.garden,mode)}catch(e){}go('home');
  var nst=Object.keys(st).length;
  notice((mode==='replace'?'✅ 已取代成匯入的資料':'✅ 合併匯入完成')+'\n已匯入 '+nWords+' 個單字'+(mode==='replace'?'':'（新增 '+added+' 個）')+'、'+nst+' 個字的答題紀錄\n'+(hasStars?'⭐ 星星：現在共 '+D.stars+' 顆':'⭐ 這份代碼是舊版的，裡面沒有星星；星星維持 '+D.stars+' 顆'));
  toast(hasStars?'已匯入 '+nWords+' 個單字、⭐ '+D.stars+' 顆星星':'已匯入 '+nWords+' 個單字');
}

function scopeWords(sc){
  if(sc==='all'||sc==='mixrev')return allWords();
  if(sc==='latest'){var l=D.weeks[D.weeks.length-1];return l?l.words.slice():[]}
  var w=findWeek(sc);return w?w.words.slice():[];
}
/* 範圍記住在本機；舊的預設「本週」一次性改成「本週＋複習」 */
var SC_KEY='vocabApp.scope',lastScope='mixrev';
(function(){try{var v=localStorage.getItem(SC_KEY);
  if(!localStorage.getItem(SC_KEY+'.m')){localStorage.setItem(SC_KEY+'.m','1');if(!v||v==='latest'){v='mixrev';localStorage.setItem(SC_KEY,v)}}
  if(v)lastScope=v}catch(e){}})();
function scopeOk(v){return v==='mixrev'||v==='latest'||v==='all'||!!findWeek(v)}
function newWords(){var l=D.weeks[D.weeks.length-1];return l?l.words.slice():[]}
function oldWords(){var r=[];D.weeks.slice(0,-1).forEach(function(w){w.words.forEach(function(x){r.push(x)})});return r}
/* 複習權重：以前答錯（總體＋最近 4 次）與很久沒練的字優先 */
function revWeight(w){var s=D.stats[w.id];if(!s)return 6;
  var h=String(s.h||''),z=0;for(var i=0;i<h.length;i++)if(h[i]==='0')z++;
  var days=s.ls?Math.max(0,(Date.now()-s.ls)/86400000):14;
  return weight(w)+z*1.5+Math.min(days,28)/3}
var REV_SHARE=0.35;
function revShare(nn){return nn>=6?REV_SHARE:nn>=3?0.5:nn>=1?0.65:1} /* 本週字太少時多抽以前的字 */
function bucketPlan(n,share){var k=Math.min(n,Math.floor(n*share+Math.random())),a=[];for(var i=0;i<n;i++)a.push(i<k);return shuffle(a)}

function hasPic(w){return !!(w.emoji||w.zh)}
function okFor(t,w){return t==='pic'?hasPic(w):t==='cloze'?canCloze(w):t==='order'?canOrder(w):true}
function weight(w){var s=D.stats[w.id];if(!s)return 3;var t=s.c+s.w;var wr=s.w/t;return 1+wr*6+(t<3?1.5:0)}
function pickWord(pool,avoid,wf){wf=wf||weight;
  var c=pool.filter(function(w){return avoid.indexOf(w.id)<0});if(!c.length)c=pool;
  var ws=c.map(wf),tot=0;ws.forEach(function(x){tot+=x});var r=Math.random()*tot;
  for(var i=0;i<c.length;i++){r-=ws[i];if(r<=0)return c[i]}return c[c.length-1];
}
/* 本週＋複習：依題號的計畫決定抽本週或以前的字；某一邊沒有適合的字就改抽另一邊 */
function pickMix(t,rev,avoid){
  var nb=G.mix.nw.filter(function(x){return okFor(t,x)}),ob=G.mix.ow.filter(function(x){return okFor(t,x)});
  if(rev&&ob.length||!nb.length){G.rev=true;return pickWord(ob,avoid,revWeight)}
  G.rev=false;return pickWord(nb,avoid)}
function startQuiz(g,sc){
  lastScope=sc;try{localStorage.setItem(SC_KEY,sc)}catch(e){}
  var pool=scopeWords(sc),mix=null;
  if(sc==='mixrev'){var nw=newWords(),ow=oldWords();if(!ow.length)pool=nw;else if(!nw.length)pool=ow;else mix={nw:nw,ow:ow,share:revShare(nw.length)}}
  if(!pool.length){toast('這個範圍沒有單字');return}
  var picPool=pool.filter(hasPic);
  if(g==='pic'&&!picPool.length){notice('「看圖選英文」需要單字有 emoji 或中文意思。請爸媽到「家長區」用「編輯」補上，例如：apple 蘋果 🍎。現在可以先玩「聽音選字」或「拼字遊戲」喔！');return}
  if(g==='cloze'||g==='order'){
    var ep=pool.filter(g==='cloze'?canCloze:canOrder);
    if(!ep.length){notice('這個範圍的單字還沒有例句，所以不能玩「'+(g==='cloze'?'句子填空':'句子排排看')+'」。請爸媽到「家長區」按「✨ 一鍵補齊缺漏」或「💬 例句」自己加，或把範圍改成「全部單字」。現在可以先玩別的遊戲喔！');return}
    if(g==='cloze'&&allWords().length<2){notice('「句子填空」至少要有 2 個單字才能出選項，請爸媽多輸入一些單字。');return}
    if(ep.length<pool.length)toast('有 '+(pool.length-ep.length)+' 個單字沒有例句，這關先跳過它們');

  var N=g==='match'?3:g==='write'?8:(g==='cloze'||g==='order')?Math.min(8,Math.max(5,pool.filter(okFor.bind(null,g)).length*2)):10,types=[];

}
function distract(w,pool,key){
  var all=allWords().filter(function(x){return x.id!==w.id&&x.en.toLowerCase()!==w.en.toLowerCase()});
  var pref=shuffle(pool.filter(function(x){return x.id!==w.id}));
  var rest=shuffle(all.filter(function(x){return pref.indexOf(x)<0}));
  var out=pref.concat(rest);
    return out.slice(0,3);
}
function qHead(){
  return topbar(false).replace('<span></span>','<button class="btn small gray" data-a="quit">✕ 結束</button>'+(G.rev?' <span class="pill" style="background:#b3a6e0;font-size:14px;vertical-align:middle">🔁 複習</span>':''))+'<div class="bar"><i style="width:'+(G.i/G.types.length*100)+'%"></i></div>';
}
function quizQ(){
  if(G.i>=G.types.length){return finish()}
  var t=G.types[G.i];G.locked=false;G.tried=false;G.nw=0;G.sayAfter=null;G.rev=false;spSeq++;
  if(t==='match')return matchQ();

  if(G.fix)w=G.fq[G.i];
  else if(G.requeue.length&&G.requeue[0].at<=G.i&&okFor(t,G.requeue[0].w)){w=G.requeue.shift().w}
  else if(G.mix)w=pickMix(t,G.mix.plan[G.i],G.recent);

    os.map(function(o,i){return '<button class="opt" data-a="ans" data-i="'+i+'">'+esc(o.en)+'</button>'}).join('')+'</div>';

    h+='<div class="mid">這個英文怎麼說？</div>'+(w.emoji?'<div class="hero pop">'+esc(w.emoji)+'</div>':'')+(w.zh?'<div class="big">'+esc(w.zh)+'</div>':'')+
    '<div class="opts">'+os2.map(function(o,i){return '<button class="opt" data-a="ans" data-i="'+i+'">'+esc(o.en)+'</button>'}).join('')+'</div><div class="msg" id="msg"></div>';
    app.innerHTML=h;

function hwPath(ctx,pts,S){
  /* 點座標以畫布寬度為單位；二次曲線平滑 */
  var p=pts.map(function(q){return [q[0]*S,q[1]*S]});
  ctx.beginPath();
  if(p.length===1){ctx.arc(p[0][0],p[0][1],ctx.lineWidth/2,0,6.2832);ctx.fill();return}
  ctx.moveTo(p[0][0],p[0][1]);
  for(var i=1;i<p.length-1;i++){var mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my)}
  ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke();
}
function hwStrokes(ctx,S,lw){
  ctx.strokeStyle='#2b2250';ctx.fillStyle='#2b2250';ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  var hw=G.hw,all=hw.strokes.slice();if(hw.cur)all.push(hw.cur);
  all.forEach(function(s){if(s.length)hwPath(ctx,s,S)});
}
function hwRedraw(){
  var c=$('#hwc');if(!c||!G||!G.hw)return;var hw=G.hw,ctx=c.getContext('2d'),d=hw.dpr;
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,hw.cw,hw.ch);
  /* 四線格 */
  var y1=hw.ch*0.28,y2=hw.ch*0.5,y3=hw.ch*0.72;
  ctx.lineWidth=1.5;ctx.strokeStyle='#cfc4f5';
  ctx.beginPath();ctx.moveTo(12,y1);ctx.lineTo(hw.cw-12,y1);ctx.moveTo(12,y3);ctx.lineTo(hw.cw-12,y3);ctx.stroke();
  ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(12,y2);ctx.lineTo(hw.cw-12,y2);ctx.stroke();ctx.setLineDash([]);

function matchQ(){
  var cand=G.pool.slice();
  var ws=[];var tmp=cand.slice();
  if(G.mix){ /* 4 張牌也照比例混入以前的字 */
    var k=Math.floor(4*G.mix.share+Math.random()),nb=G.mix.nw.slice(),ob=G.mix.ow.slice(),ro=0,flags=[];
    while(ws.length<4&&(nb.length||ob.length)){
      var useO=ob.length&&(ro<k||!nb.length);
      var x=useO?pickWord(ob,[],revWeight):pickWord(nb,[]);
      ws.push(x);flags.push(!!useO);if(useO)ro++;
      nb=nb.filter(function(y){return y.id!==x.id});ob=ob.filter(function(y){return y.id!==x.id})}
    G.mixLast=flags;tmp=[];
  }
  while(ws.length<4&&tmp.length){ws.push(pickWord(tmp,ws.map(function(x){return x.id})));tmp=tmp.filter(function(x){return ws.indexOf(x)<0})}
  var cards=[];
  ws.forEach(function(w){cards.push({id:w.id,w:w,side:'en'});cards.push({id:w.id,w:w,side:'pic'})});
  G.m={cards:shuffle(cards),open:[],done:0,total:ws.length,bad:{}};
  matchDraw();
}
function matchDraw(){
  var m=G.m;
  app.innerHTML=qHead()+'<div class="mid">翻翻看：把英文和它的圖／中文／發音配成一對</div><div class="mgrid">'+m.cards.map(function(c,i){
    var up=m.open.indexOf(i)>=0||c.done;
    var txt=c.side==='en'?esc(c.w.en):(c.w.emoji?'<span style="font-size:48px">'+esc(c.w.emoji)+'</span>'+(c.w.zh?'<div style="font-size:18px">'+esc(c.w.zh)+'</div>':''):(c.w.zh?esc(c.w.zh):'<span style="font-size:48px">🔊</span>'));
    return '<button class="mcard'+(up?' up':'')+(c.done?' done':'')+'" data-a="flip" data-i="'+i+'">'+(up?txt:'❓')+'</button>'}).join('')+'</div><div class="msg" id="msg"></div>';
}
function onFlip(i){
  var m=G.m,c=m.cards[i];if(G.locked||c.done||m.open.indexOf(i)>=0)return;
  m.open.push(i);sndTap();if(c.side==='en'||!hasPic(c.w))say(c.w.en);matchDraw();
  if(m.open.length===2){
    var a=m.cards[m.open[0]],b=m.cards[m.open[1]];G.locked=true;
    if(a.id===b.id&&a.side!==b.side){
      a.done=b.done=true;m.done++;m.open=[];
      if(!m.bad[a.id]){rec(a.id,true);D.stars++;G.gained++;save()}
      sndOk();confetti(30);G.locked=false;matchDraw();$('#msg').textContent=praise2();
      if(m.done===m.total){G.ok++;G.first++;G.i++;sndWin();confetti(100);setTimeout(quizQ,1600)}
    }else{
      sndNo();if(!m.bad[a.id]){m.bad[a.id]=1;rec(a.id,false)}if(!m.bad[b.id]){m.bad[b.id]=1;rec(b.id,false)}
      $('#msg').textContent=tryag();
      setTimeout(function(){m.open=[];G.locked=false;matchDraw()},900);
    }
  }
}
function finish(){
  var bonus=0;if(G.first===G.types.length&&G.types.length>=3){bonus=3;D.stars+=3;G.gained+=3}
  save();try{G.gr=gRound()}catch(e){G.gr=null}view='result';sndWin();confetti(160);render();
  if(G.fix)return;
  spSync().then(function(){var g=G;setTimeout(function(){if(view==='result'&&!spCheck())qvMaybe(g)},1400)});
}
function result(){
  if(G.fix)return fixResult();
  var n=G.types.length,p=G.first/n;
  var face=p>=.9?'🏆':p>=.6?'🎉':'💪';
  app.innerHTML=topbar(false)+'<div class="hero pop">'+face+'</div><h1>'+(p>=.9?'太厲害了！':p>=.6?'表現很棒！':'再接再厲！')+'</h1>'+
  '<div class="card mid" style="font-size:30px">第一次就答對：<b>'+G.first+' / '+n+'</b><br>這次獲得：<b style="color:#e08a00">⭐ '+G.gained+'</b>'+(G.first===n&&n>=3?'<br>全對獎勵 +3 ⭐':'')+'</div>'+(function(){try{return gRoundCard(G.gr)}catch(e){return ''}})()+
  '<div class="grid g2"><button class="btn green" data-a="again">🔁 再玩一次</button><button class="btn blue" data-a="home">🏠 回首頁</button></div>'+
  (G.gr&&G.gr.water?'<button class="btn" style="width:100%;margin-top:14px;background:#ff8fb1;box-shadow:0 6px 0 #d0457a" data-a="garden">🌸 去Ante島看看</button>':'');
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;ac();
  switch(a){
    case 'sptake':spTake();break;
    case 'qvclose':{var qo=$('#qvov');if(qo)qo.remove();break}
    case 'closenotice':$('#notice').style.display='none';break;
    case 'home':go('home');break;
    case 'parent':go('parent');break;
    case 'io':go('io');break;
    case 'learn':learn();break;
    case 'garden':{var gq=$('#gpov');if(gq)gq.remove();go('garden');break}
    case 'gbed':sndTap();gToggle(el.dataset.id,el.dataset.def==='1');break;
    case 'gplant':sndTap();gOpen(el.dataset.id);break;
    case 'gsay':{var gw=wordById(el.dataset.id);if(gw)say(gw.en);break}
    case 'gpclose':{var gp=$('#gpov');if(gp)gp.remove();break}
    case 'quizmenu':go('quizmenu');break;
    case 'fix':{var gf=$('#gpov');if(gf)gf.remove();sndTap();startFix();break}
    case 'say':say(el.dataset.t,!!el.dataset.s);break;
    case 'addweek':{
      var ws=parseLines($('#batch').value);if(!ws.length){toast('請輸入至少一個英文單字');return}
      fillWords(ws,false);
      var nwk={id:uid(),name:$('#wkname').value.trim()||('第'+(D.weeks.length+1)+'週'),words:ws};D.weeks.push(nwk);save();toast('已加入 '+ws.length+' 個單字');parent();
      bgFill(nwk,ws);break}
    case 'addto':editWeek=editWeek===el.dataset.id?null:el.dataset.id;parent();break;
    case 'savemore':{var wk=findWeek(el.dataset.id),nw=parseLines($('#more').value);fillWords(nw,false);wk.words=wk.words.concat(nw);save();editWeek=null;toast('已補上 '+nw.length+' 個');parent();bgFill(wk,nw);break}
    case 'fillweek':{var fw=findWeek(el.dataset.id);if(!fw)break;toast('補齊中…');
      var tgt=fw.words.filter(isMiss);
      fillWords(tgt,true).then(function(st){save();if(view==='parent')parent();notice(fillReport(st))});break}
    case 'rename':{var wk2=findWeek(el.dataset.id),nm=prompt('新的週名稱',wk2.name);if(nm){wk2.name=nm;save();parent()}break}
    case 'delweek':if(confirm('確定刪除這一週的所有單字？')){D.weeks=D.weeks.filter(function(w){return w.id!==el.dataset.id});save();parent()}break;
    case 'delw':D.weeks.forEach(function(w){w.words=w.words.filter(function(x){return x.id!==el.dataset.id})});delete D.stats[el.dataset.id];save();parent();break;
    case 'editw':D.weeks.forEach(function(w){w.words.forEach(function(x){
      if(x.id===el.dataset.id){var en=prompt('英文',x.en);if(en===null)return;var zh=prompt('中文意思（可留白）',x.zh||'');var em=prompt('emoji（可留白）',x.emoji||'');
        var nz=(zh||'').trim(),ne=(em||'').trim();if(x.auto){if(nz!==(x.zh||''))delete x.auto.zh;if(ne!==(x.emoji||''))delete x.auto.emoji}
        if(en.trim())x.en=en.trim();x.zh=nz;x.emoji=ne;if(hasEx(x))x.exForm=findForm(x.ex,x.en);save()}})});parent();break;
    case 'resetstats':if(confirm('確定清除答題紀錄與星星？（Ante島的花也會重新從種子開始）')){D.stats={};D.stars=0;D.fix={};D.fixv=1;save();try{gReset()}catch(e){}parent()}break;
    case 'exportfile':{
      var blob=new Blob([exportText()],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
      l.href=u;l.download='vocab-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('若沒有下載，請改用「複製文字代碼」');break}
    case 'exportcopy':{
      var t=exportText(),ta=$('#code');ta.value=t;ta.removeAttribute('readonly');ta.focus();ta.select();ta.setSelectionRange(0,t.length);
      var ok=false;try{ok=document.execCommand('copy')}catch(x){}
      if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('已複製')},function(){});
      ta.setAttribute('readonly','');toast(ok?'已複製！到另一台貼上即可':'請長按文字全選後拷貝');break}
    case 'import':{
      var txt=$('#paste').value;
      if(txt.trim()){doImport(txt,el.dataset.m)}
      else{var f=$('#file').files[0];if(!f){toast('請選擇檔案或貼上代碼');return}
        var r=new FileReader();r.onload=function(){doImport(String(r.result),el.dataset.m)};r.readAsText(f)}
      break}
    case 'start':{var sc=$('#scope').value;startQuiz(el.dataset.g,sc);break}
    case 'again':startQuiz(G.g,lastScope);break;
    case 'quit':if(confirm('要結束這次挑戰嗎？')){G=null;go('home')}break;
    case 'ans':onAns(+el.dataset.i);break;
    case 'tile':onTile(+el.dataset.k);break;
    case 'spellundo':spellUndo();break;
    case 'hwundo':if(G&&G.hw&&!G.locked){G.hw.strokes.pop();hwRedraw()}break;
    case 'hwclear':if(G&&G.hw&&!G.locked){G.hw.strokes=[];G.hw.cur=null;hwRedraw()}break;
    case 'hwhint':hwHint();break;
    case 'hwreveal':hwDone();break;
    case 'hwmanual':hwReveal();break;
    case 'hwok':hwOk();break;
    case 'hwretry':hwRetry();break;
    case 'flip':onFlip(+el.dataset.i);break;
    case 'clans':clozeAns(+el.dataset.i);break;
    case 'clsay':clozeSay(!!el.dataset.s);break;
    case 'orpick':orderPick(+el.dataset.k);break;
    case 'orback':orderBack(+el.dataset.k);break;
    case 'orsay':if(G&&G.w)sayParts([G.w.ex],!!el.dataset.s);break;
    case 'sayex':{var lw=wordById(el.dataset.id);if(!lw)break;var slw=!!el.dataset.s;sayParts(hasEx(lw)?(slw?[lw.ex]:[lw.en,lw.ex]):[lw.en],slw);break}
    case 'editex':{var xw=wordById(el.dataset.id);if(!xw)break;
      var se=prompt('「'+xw.en+'」的例句（英文，要包含這個字；留白＝不用例句）',xw.ex||'');if(se===null)break;se=se.trim().replace(/\s+/g,' ');
      if(!se){xw.ex='';xw.exZh='';xw.exForm='';if(xw.auto)delete xw.auto.ex;save();parent();toast('已移除例句');break}
      var sz=prompt('例句的中文翻譯（可留白）',se===xw.ex?(xw.exZh||''):'');if(sz===null)break;
      var changed=se!==xw.ex||sz.trim()!==(xw.exZh||'');
      xw.ex=se;xw.exZh=sz.trim();xw.exForm=findForm(se,xw.en);if(changed&&xw.auto)delete xw.auto.ex;save();parent();
      toast(xw.exForm?'例句已儲存':'句子裡找不到「'+xw.en+'」，這句只會用在學習卡和排排看');break}
  }
});
